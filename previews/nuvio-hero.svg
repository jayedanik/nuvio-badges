<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Deep cinema gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090C"/>
      <stop offset="40%" stop-color="#0E121A"/>
      <stop offset="70%" stop-color="#140E1E"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>

    <!-- Glowing accent lines -->
    <linearGradient id="glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF416C" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FF4B2B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="1"/>
      <stop offset="70%" stop-color="#4FACFE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00F2FE" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg)"/>
  
  <!-- Subtle Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Top Accent Beam -->
  <rect x="100" y="0" width="1000" height="2" fill="url(#glow-line)"/>

  <!-- Logo Pill Badge -->
  <g transform="translate(600, 75)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#181D28" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="-85" cy="0" r="5" fill="#00FF88"/>
    <text x="-70" y="5" fill="#E2E8F0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">NUVIO BADGE SYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="160" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5" filter="url(#shadow)">
    Next-Gen Floating Stream Badges
  </text>

  <!-- Subtitle -->
  <text x="600" y="202" text-anchor="middle" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="500" font-size="18" letter-spacing="0.2">
    373 Pristine Vector Badges • 96px StreamBridge Standard • OLED Luminous Contrast • Zero Lag
  </text>

  <!-- Spec Pills Row -->
  <g transform="translate(600, 265)">
    <!-- Pill 1: Bangladesh #1 Priority -->
    <g transform="translate(-390, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#131924" stroke="#22C55E" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="-80" cy="0" r="7" fill="#006A4E"/>
      <circle cx="-79" cy="0" r="3.5" fill="#F42A41"/>
      <text x="-64" y="5" fill="#F1F5F9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="700" font-size="12" letter-spacing="0.8">BANGLADESH #1 OTT</text>
    </g>

    <!-- Pill 2: 96px Master Canvas -->
    <g transform="translate(-130, 0)">
      <rect x="-100" y="-18" width="200" height="36" rx="18" fill="#131924" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" fill="#F1F5F9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="700" font-size="12" letter-spacing="0.8">96PX STANDARD SCALE</text>
    </g>

    <!-- Pill 3: 4K OLED Contrast -->
    <g transform="translate(130, 0)">
      <rect x="-100" y="-18" width="200" height="36" rx="18" fill="#131924" stroke="#A855F7" stroke-opacity="0.5" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" fill="#F1F5F9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="700" font-size="12" letter-spacing="0.8">4K OLED CONTRAST</text>
    </g>

    <!-- Pill 4: Pure Background-Free -->
    <g transform="translate(390, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#131924" stroke="#EAB308" stroke-opacity="0.5" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" fill="#F1F5F9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="700" font-size="12" letter-spacing="0.8">100% BACKGROUND-FREE</text>
    </g>
  </g>

  <!-- Bottom Accent Beam -->
  <rect x="250" y="358" width="700" height="2" fill="url(#glow-line)"/>
</svg>
